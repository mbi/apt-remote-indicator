[project]
name = "apt-remote-indicator"
version = "0.1.0"
description = "GNOME tray applet polling remote hosts over SSH for pending apt upgrades"
requires-python = ">=3.14"
dependencies = [
    "pygobject",
    "paramiko",
    "systemd-python",
]

[tool.isort]
# isort defaults to 79 columns while ruff-format uses 88, so each hook undid the
# other's wrapping of long imports. The black profile uses ruff-compatible
# 88-column wrapping (parentheses, trailing comma, one name per line).
profile = "black"

[tool.uv]
# Plain script project: never build/install the project itself, only its deps.
package = false

[tool.pytest.ini_options]
# `app.py` lives at the repo root, not in a package.
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
